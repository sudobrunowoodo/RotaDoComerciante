<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de feirante</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --laranja: #F25C05;
            --laranja-escuro: #D44C00;
            --laranja-claro: #FFF1E8;
            --tinta: #3A1D0A;
            --tinta-suave: #7A5A47;
            --borda: #F0D5C3;
            --branco: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--branco);
            color: var(--tinta);
            font-family: "Nunito", "Segoe UI", Arial, sans-serif;
        }

        .cartao {
            width: 100%;
            max-width: 420px;
            padding: 32px 28px 28px;
            border: 2px solid var(--borda);
            border-radius: 24px;
            background: var(--branco);
            text-align: center;
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 12px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: var(--laranja);
        }

        .logo svg { width: 44px; height: 44px; }

        h1 {
            margin: 0;
            font-family: "Lilita One", "Arial Black", Impact, sans-serif;
            font-weight: 400;
            font-size: 2.2rem;
            line-height: 1.1;
            letter-spacing: 0.5px;
            color: var(--laranja);
        }

        .subtitulo {
            margin: 6px 0 24px;
            font-size: 1.05rem;
            color: var(--tinta-suave);
        }

        form { text-align: left; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 0.98rem;
        }

        .campo { margin-bottom: 18px; }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--borda);
            border-radius: 14px;
            background: var(--branco);
            color: var(--tinta);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder { color: #B79A88; }

        input:focus {
            outline: none;
            border-color: var(--laranja);
            box-shadow: 0 0 0 4px rgba(242, 92, 5, 0.18);
        }

        button {
            width: 100%;
            margin-top: 6px;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: var(--laranja);
            color: var(--branco);
            font-family: "Lilita One", "Arial Black", Impact, sans-serif;
            font-size: 1.35rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.15s;
        }

        button:hover { background: var(--laranja-escuro); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:focus-visible {
            outline: 3px solid var(--tinta);
            outline-offset: 3px;
        }

        .voltar {
            display: block;
            margin-top: 20px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--tinta-suave);
            text-decoration: none;
        }

        .voltar:hover { color: var(--laranja); text-decoration: underline; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <main class="cartao">

        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 18 L10 7 H38 L42 18 Z"/>
                <path d="M6 18 q4.5 6 9 0 q4.5 6 9 0 q4.5 6 9 0 q4.5 6 9 0"/>
                <path d="M9 24 V41 H39 V24"/>
                <path d="M19 41 V31 H29 V41"/>
            </svg>
        </div>

        <h1>Cadastro de Comerciante</h1>
        <p class="subtitulo">Registre sua barraca com a gente</p>

        <form action="/registrar" method="POST">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Seu nome completo"
                       autocomplete="name" required>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email"
                       placeholder="seu@email.com"
                       autocomplete="email" required>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha"
                       placeholder="Crie uma senha"
                       autocomplete="new-password" required>
            </div>

            <div class="campo">
                <label for="cnpj">CNPJ</label>
                <input type="text" id="cnpj" name="cnpj"
                       placeholder="00.000.000/0000-00"
                       autocomplete="off" required>
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <a class="voltar" href="/">Voltar para o menu inical</a>
    </main>
</body>
</html>
