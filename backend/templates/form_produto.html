<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
</head>
<body>
    <h1>
        {% if produto %}
            Editar Produto
        {% else %}
            Cadastrar Produto
        {% endif %}
    </h1>

    {% if erro %}
        <p>{{ erro }}</p>
    {% endif %}

    <form method="post">
        Nome:
        <input type="text" name="nomeForm"
               value="{{ dados.get('nomeForm', '') }}"
               maxlength="80" required>
        <br><br>

        Descrição:
        <textarea name="descricaoForm"
                  maxlength="200">{{ dados.get('descricaoForm', '') }}</textarea>
        <br><br>

        Preço:
        <input type="text" name="precoForm"
               value="{{ dados.get('precoForm', '') }}"
               placeholder="10,50" required>
        <br><br>

        Foto (link):
        <input type="text" name="fotoForm"
               value="{{ dados.get('fotoForm', '') }}"
               maxlength="255">
        <br><br>

        <button type="submit">
            {% if produto %}
                Salvar Alterações
            {% else %}
                Cadastrar Produto
            {% endif %}
        </button>
    </form>

    <br>

    <a href="{{ url_for('produtos') }}">Voltar para Produtos</a>
</body>
</html>
