<!DOCTYPE html>
<html lang="en">
<head>              
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <h1>Feirantes</h1>
    <ul>
        {% for feirante in feirantes %}
            <li>{{ feirante.nome }} - {{ feirante.email }} - {{ feirante.status }}:
                <a href="{{ url_for('deletar', id=feirante.id) }}">Deletar</a>
                <a href="{{ url_for('editar', id=feirante.id) }}">Editar</a>
            </li>
        {% endfor %}
        <a href="/logout">Logout</a>
    </ul>
    <a href="/registrar">Registrar Feirante</a>
</body>
</html>
