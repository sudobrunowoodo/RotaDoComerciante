<!DOCTYPE html>
<html lang="en">
<head>              
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar</title>
</head>
<body>
    <h1>Editar Contato</h1>
    <form action="" method="post">
        Nome:<input type="text" name="nomeForm" value="{{ contato.nome }}" required><br>
        Telefone:<input type="text" name="telefoneForm" value="{{ contato.telefone }}" required><br>
        email:<input type="text" name="emailForm" value="{{ contato.email }}" required><br>
        local:<input type="text" name="localForm" value="{{ contato.local }}" required><br>
        produto:<input type="text" name="produtoForm" value="{{ contato.produto }}" required><br>
        <input type="submit" value="Editar">
    </form>
</body>
</html>
