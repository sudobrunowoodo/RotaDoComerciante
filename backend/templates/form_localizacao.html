<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localização</title>
</head>
<body>
    <h1>
        {% if localizacao %}
            Editar Localização
        {% else %}
            Cadastrar Localização
        {% endif %}
    </h1>

    {% if erro %}
        <p>{{ erro }}</p>
    {% endif %}

    <form method="post">
        Endereço:
        <input type="text" name="enderecoForm"
               value="{{ dados.get('enderecoForm', '') }}"
               maxlength="200" required>
        <br><br>

        Latitude:
        <input type="text" name="latitudeForm"
               value="{{ dados.get('latitudeForm', '') }}"
               placeholder="-7.2131" required>
        <br><br>

        Longitude:
        <input type="text" name="longitudeForm"
               value="{{ dados.get('longitudeForm', '') }}"
               placeholder="-39.3153" required>
        <br><br>

        Horário de abertura:
        <input type="time" name="aberturaForm"
               value="{{ dados.get('aberturaForm', '') }}" required>
        <br><br>

        Horário de fechamento:
        <input type="time" name="fechamentoForm"
               value="{{ dados.get('fechamentoForm', '') }}" required>
        <br><br>

        <button type="submit">
            {% if localizacao %}
                Salvar Alterações
            {% else %}
                Cadastrar Localização
            {% endif %}
        </button>
    </form>

    <br>

    <a href="{{ url_for('localizacoes') }}">Voltar para Localização</a>
</body>
</html>
