<!DOCTYPE html>
<html lang="en">
<head>              
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
</head>
<body>
    <h1>Registrar Comerciante</h1>
    <form action="/registrar" method="post">
        Nome:<input type="text" name="nomeForm" required><br>
        Telefone:<input type="text" name="telefoneForm" required><br>
        email:<input type="text" name="emailForm" required><br>
        senha:<input type="text" name="senhaForm" required><br>
        local:<input type="text" name="localForm" required><br>
        produto:<input type="text" name="produtoForm" required><br>
        <input type="submit" value="Registrar">


    </form>

    <a href="/">Ir para Contatos</a>

</body>
</html>
